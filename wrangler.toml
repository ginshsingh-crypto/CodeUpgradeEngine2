# LOD400 Shop Drawing Platform - Cloudflare Workers

name = "lod400-platform"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Global placement - run close to data
[placement]
mode = "smart"

# Bindings
[vars]
PRICE_PER_SHEET_SAR = "150"
MIN_ADDIN_VERSION = "1.0.0"

# R2 Bucket for file storage (GCS replacement)
[[r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "lod400-files"

# KV namespace for sessions/rate limiting
[[kv_namespaces]]
binding = "SESSIONS"
id = "your-kv-namespace-id"

# Secrets (set via wrangler secret put)
# DATABASE_URL - Neon connection string (with pooler)
# MOYASAR_SECRET_KEY
# MOYASAR_PUBLISHABLE_KEY
# MOYASAR_WEBHOOK_SECRET
# RESEND_API_KEY
# R2_ACCOUNT_ID - Cloudflare account ID
# R2_ACCESS_KEY_ID - R2 API token access key
# R2_SECRET_ACCESS_KEY - R2 API token secret

[build]
command = "npm run build:worker"

# Development settings
[dev]
port = 8787
local_protocol = "http"
